name: kotlin-booking-lab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-booking}
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-booking}
      DB_USER: ${DB_USER:-booking}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
